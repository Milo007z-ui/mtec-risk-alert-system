<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ระบบแจ้งเตือนจุดเสี่ยงอุบัติเหตุ — กรุงเทพฯ และปริมณฑล</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="css/style.css?v=8">
</head>
<body>
  <div id="status-bar">
    <span id="gps-status">กำลังโหลด...</span>
    <span id="nearest-info"></span>
    <a id="link-dashboard" href="dashboard.html" title="ดูสถิติ">📊 สถิติ</a>
  </div>

  <div id="map"></div>

  <div id="alert-banner" class="alert-banner hidden"></div>

  <button id="btn-recenter" class="hidden">📍 กลับมาที่ตำแหน่งฉัน</button>

  <!-- ตัวกรองจุดเสี่ยง — ตัวเลือกจังหวัด/ประเภทปัญหาเติมจากข้อมูลใน js/filters.js -->
  <div id="filter-panel">
    <div class="filter-head">
      <span class="filter-title">ตัวกรองจุดเสี่ยง</span>
      <button id="filter-toggle" type="button" title="ย่อ/ขยายแผงตัวกรอง">▾</button>
    </div>

    <div class="filter-body">
      <label class="filter-label" for="f-province">จังหวัด</label>
      <select id="f-province">
        <option value="">ทุกจังหวัด</option>
      </select>

      <div class="filter-label">ระดับความเสี่ยง</div>
      <div class="filter-levels">
        <label><input type="checkbox" id="f-level-high" checked>
          <span class="dot" style="background:#c62828"></span>เสี่ยงสูง</label>
        <label><input type="checkbox" id="f-level-medium" checked>
          <span class="dot" style="background:#ef6c00"></span>ปานกลาง</label>
        <label><input type="checkbox" id="f-level-low" checked>
          <span class="dot" style="background:#2e7d32"></span>ต่ำ</label>
      </div>

      <label class="filter-label" for="f-pattern">ประเภทปัญหาหลัก</label>
      <select id="f-pattern"></select>

      <div class="filter-levels filter-layers">
        <label><input type="checkbox" id="f-show-accidents">
          <span class="dot dot-sm"></span>ดูจุดเสี่ยงรายอุบัติเหตุ</label>
        <span class="filter-hint">4,460 จุด · ดูอย่างเดียว ไม่มีผลกับการแจ้งเตือน</span>
      </div>

      <div class="filter-foot">
        <span id="filter-count"></span>
        <button id="filter-reset" type="button">ล้างตัวกรอง</button>
      </div>
    </div>
  </div>

  <div id="legend">
    <div><span class="dot" style="background:#c62828"></span> เสี่ยงสูง</div>
    <div><span class="dot" style="background:#ef6c00"></span> ปานกลาง</div>
    <div><span class="dot" style="background:#2e7d32"></span> ต่ำ</div>
  </div>

  <div id="start-overlay">
    <div class="start-card">
      <h1>🚨 ระบบแจ้งเตือนจุดเสี่ยงอุบัติเหตุ</h1>
      <p>กรุงเทพฯ และปริมณฑล — แจ้งเตือนด้วยเสียงเมื่อเข้าใกล้จุดเสี่ยงในระยะ 500 เมตร</p>
      <button id="btn-start">เริ่มใช้งาน</button>
      <p class="hint">ต้องอนุญาตให้เข้าถึงตำแหน่ง และเปิดเสียงเครื่อง</p>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/distance.js"></script>
  <script src="js/tts.js"></script>
  <script src="js/riskrules.js?v=6"></script>
  <script src="js/riskpoints.js?v=18"></script>
  <!-- ชั้นดูจุดเสี่ยงรายอุบัติเหตุ 4,460 จุด (เริ่มต้นปิด ไม่มีผลกับการแจ้งเตือน) -->
  <script src="js/accidents.js?v=6"></script>
  <script src="js/filters.js?v=14"></script>
  <script src="js/map.js?v=7"></script>
  <script src="js/gps.js?v=11"></script>
  <script src="js/alert.js?v=11"></script>
  <script src="js/app.js?v=13"></script>
</body>
</html>
